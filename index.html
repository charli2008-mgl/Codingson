<!doctype html>
<html lang="mn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Нэвтрэх</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=YOUR_GA_MEASUREMENT_ID"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "YOUR_GA_MEASUREMENT_ID");
    </script>
    <!-- Google Sign-In -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Inter", sans-serif;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        background:
          radial-gradient(
            circle at 20% 10%,
            rgba(74, 144, 226, 0.18),
            transparent 18%
          ),
          radial-gradient(
            circle at 80% 15%,
            rgba(53, 123, 189, 0.16),
            transparent 16%
          ),
          radial-gradient(
            circle at 50% 90%,
            rgba(74, 144, 226, 0.12),
            transparent 24%
          ),
          #e8eff7;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 16px;
      }

      .main-container {
        display: flex;
        width: min(960px, 100%);
        max-height: calc(100vh - 32px);
        min-height: 520px;
        background: linear-gradient(180deg, #ffffff 0%, #f7faff 100%);
        border-radius: 24px;
        overflow: hidden;
        box-shadow: 0 28px 56px rgba(21, 38, 70, 0.11);
        border: 1px solid rgba(109, 146, 196, 0.15);
      }

      .side-panel {
        position: relative;
        flex: 0.75;
        background: linear-gradient(135deg, #3f73f8 0%, #00d6ff 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        padding: 22px;
        overflow: hidden;
      }

      .side-panel.right {
        background: linear-gradient(225deg, #3f73f8 0%, #00d6ff 100%);
      }

      .side-panel::before {
        content: "";
        position: absolute;
        width: 260px;
        height: 260px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.18);
        top: -60px;
        right: -50px;
        filter: blur(32px);
        pointer-events: none;
      }

      .side-panel::after {
        content: "";
        position: absolute;
        width: 180px;
        height: 180px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.12);
        bottom: -50px;
        left: -40px;
        filter: blur(24px);
        pointer-events: none;
      }

      .side-panel.right::after {
        left: auto;
        right: -40px;
        bottom: -60px;
      }

      .form-side {
        flex: 1.5;
        padding: 35px 35px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: white;
      }

      .login-card {
        width: 100%;
        max-width: 460px;
      }

      h2 {
        font-size: 34px;
        color: #102240;
        margin-bottom: 12px;
        font-weight: 800;
        text-align: center;
      }

      .subtitle {
        font-size: 15px;
        color: #64748b;
        margin-bottom: 28px;
        text-align: center;
      }

      .input-group {
        margin-bottom: 22px;
      }

      .input-group label {
        display: block;
        font-size: 13px;
        font-weight: 700;
        color: #475569;
        margin-bottom: 10px;
        text-transform: uppercase;
      }

      .input-wrapper {
        position: relative;
        display: flex;
        align-items: center;
      }

      .input-wrapper i {
        position: absolute;
        left: 18px;
        color: #94a3b8;
        font-size: 18px;
      }

      .input-wrapper input {
        width: 100%;
        padding: 18px 18px 18px 50px;
        border: 2px solid #e2e8f0;
        border-radius: 14px;
        font-size: 16px;
        outline: none;
        background: #f8fbff;
        transition: all 0.25s ease;
      }

      .input-wrapper input:hover {
        border-color: #cbd5e1;
      }

      .input-wrapper input:focus {
        border-color: #4a90e2;
        background: #ffffff;
        box-shadow: 0 0 0 5px rgba(74, 144, 226, 0.08);
      }

      .options-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        font-size: 14px;
        margin-bottom: 30px;
        color: #475569;
      }

      .options-row label {
        display: flex;
        align-items: center;
        gap: 10px;
        cursor: pointer;
      }

      .forgot-link {
        color: #3865e5;
        text-decoration: none;
        font-weight: 600;
      }

      .login-btn {
        width: 100%;
        padding: 18px;
        background: linear-gradient(135deg, #3865e5 0%, #2b4ab4 100%);
        color: white;
        border: none;
        border-radius: 14px;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.25s ease;
      }

      .login-btn:hover {
        background: linear-gradient(135deg, #2f5ad3 0%, #23409b 100%);
        transform: translateY(-1px);
        box-shadow: 0 14px 28px rgba(56, 101, 229, 0.22);
      }

      .divider {
        position: relative;
        margin: 34px 0 18px;
        color: #94a3b8;
        text-align: center;
        font-size: 14px;
      }

      .divider::before,
      .divider::after {
        content: "";
        position: absolute;
        top: 50%;
        width: calc(50% - 55px);
        height: 1px;
        background: #e2e8f0;
      }

      .divider::before {
        left: 0;
      }

      .divider::after {
        right: 0;
      }

      .social-text {
        color: #475569;
        text-align: center;
        font-size: 14px;
      }

      .footer-text {
        margin-top: 26px;
        text-align: center;
        font-size: 14px;
        color: #64748b;
      }

      .footer-text a {
        color: #3865e5;
        font-weight: 700;
        text-decoration: none;
      }

      @media (max-width: 1040px) {
        .main-container {
          flex-direction: column;
          min-height: auto;
        }

        .side-panel,
        .side-panel.right {
          display: none;
        }

        .form-side {
          padding: 32px 24px;
        }
      }
    </style>
  </head>
  <body>
    <div class="main-container">
      <div class="side-panel"></div>

      <div class="form-side">
        <div class="login-card">
          <h2>Тавтай морилно уу</h2>
          <p class="subtitle">Аккаунтын мэдээллээ оруулна уу.</p>
          <form
            onsubmit="
              window.location.href = 'main.html';
              return false;
            ">
            <div class="input-group">
              <label>И-мэйл хаяг</label>
              <div class="input-wrapper">
                <i class="fa-regular fa-envelope"></i>
                <input type="email" placeholder="login@gmail.com" required />
              </div>
            </div>

            <div class="input-group">
              <label>Нууц үг</label>
              <div class="input-wrapper">
                <i class="fa-solid fa-lock"></i>
                <input type="password" placeholder="••••••••" required />
              </div>
            </div>

            <div class="options-row">
              <label>
                <input type="checkbox" />
                Намайг сана
              </label>
              <a href="#" class="forgot-link">Нууц үгээ мартсан уу?</a>
            </div>

            <button type="submit" class="login-btn">Нэвтрэх</button>
          </form>

          <div class="divider">эсвэл</div>
          <div class="social-text">Google-ээр хялбар нэвтрэх</div>
          <div
            id="g_id_signin"
            style="display: flex; justify-content: center"></div>

          <p class="footer-text">
            Бүртгэлгүй юу? <a href="register.html">Аккаунт үүсгэх</a>
          </p>
        </div>
      </div>

      <div class="side-panel right"></div>
    </div>
    <script>
      // Google Sign-In initialization for login
      function handleCredentialResponse(response) {
        const responsePayload = decodeJwtResponse(response.credential);
        console.log("ID: " + responsePayload.sub);
        console.log("Full Name: " + responsePayload.name);
        console.log("Email: " + responsePayload.email);
        // Handle login with Google
        alert("Logged in with Google: " + responsePayload.name);
        gtag("event", "google_login", {
          event_category: "engagement",
          event_label: "google_signin",
        });
        // Redirect to main.html or profile
        window.location.href = "main.html";
      }

      function decodeJwtResponse(token) {
        var base64Url = token.split(".")[1];
        var base64 = base64Url.replace(/-/g, "+").replace(/_/g, "/");
        var jsonPayload = decodeURIComponent(
          atob(base64)
            .split("")
            .map(function (c) {
              return "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2);
            })
            .join(""),
        );
        return JSON.parse(jsonPayload);
      }

      window.onload = function () {
        google.accounts.id.initialize({
          client_id: "YOUR_GOOGLE_CLIENT_ID",
          callback: handleCredentialResponse,
        });
        google.accounts.id.renderButton(
          document.getElementById("g_id_signin"),
          { theme: "outline", size: "large" },
        );
        google.accounts.id.prompt();
      };
    </script>
  </body>
</html>
